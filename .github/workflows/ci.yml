name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - run: rustc -Vv && uname -m
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: ./packaging/macos/build-app.sh target/aarch64-apple-darwin/release/autoclicker-x20
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Autoclicker-X20-macos-arm64
          path: outputs/Autoclicker-X20-0.1.0-macos-arm64.zip
